<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Learning Lab - Spin the Wheel</title>
<style>
/* ===================== App UI (all rules scoped to .sll-app) ===================== */
.sll-app, .sll-app * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.sll-app {
  --blue: #2b5b84; --blue-dark: #1f4666; --blue-soft: #eaf1f8;
  --amber: #f5a623; --amber-dark: #d98d0b;
  --ink: #1f2d3a; --muted: #5d6f80; --line: #d9e4ee; --bg: #f1f6fa;
  font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  padding: 24px 16px 40px;
  line-height: 1.4;
}
.sll-wrap { max-width: 1120px; margin: 0 auto; }

.sll-header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.sll-mark { width: 46px; height: 46px; flex: none; border-radius: 13px; background: var(--blue); display: grid; place-items: center; }
.sll-mark svg { width: 28px; height: 28px; }
.sll-app .sll-title-main { margin: 0; padding: 0; font-family: inherit; font-size: 1.6rem; font-weight: 700; line-height: 1.15; letter-spacing: normal; text-transform: none; color: var(--blue); }
.sll-app .sll-tagline { margin: 3px 0 0; font-size: .95rem; color: var(--muted); }

.sll-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 22px; align-items: start; }
@media (max-width: 860px) { .sll-layout { grid-template-columns: minmax(0, 1fr); } }

.sll-card { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 2px 12px rgba(31, 70, 102, .07); }

/* ---------- The wheel ---------- */
.sll-wheelcard { position: relative; display: flex; flex-direction: column; align-items: center; padding: 22px 16px 20px; overflow: hidden; }
.sll-wheelbox { position: relative; width: min(100%, 620px); aspect-ratio: 1; margin: 14px 0 6px; }
.sll-wheelbox canvas { display: block; width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 10px 30px rgba(31, 70, 102, .25); cursor: pointer; }
.sll-wheelbox canvas:focus-visible { outline: 4px solid rgba(74, 144, 226, .6); outline-offset: 4px; }
.sll-pointer { position: absolute; left: 50%; top: -3%; width: 8%; margin-left: -4%; transform-origin: 50% 8%; pointer-events: none; z-index: 2; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .3)); }
.sll-pointer svg { display: block; width: 100%; height: auto; }
.sll-hub { position: absolute; left: 50%; top: 50%; width: 19%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 5px solid var(--blue); border-radius: 50%; background: #fff; color: var(--blue); font-weight: 800; letter-spacing: .04em; cursor: pointer; box-shadow: 0 3px 10px rgba(0, 0, 0, .25); z-index: 2; padding: 0; }
.sll-hub:hover:not([disabled]) { background: var(--blue-soft); }
.sll-hub:active:not([disabled]) { transform: translate(-50%, -50%) scale(.96); }
.sll-hub[disabled] { color: #9fb0bf; border-color: #b9c8d6; cursor: default; }
.sll-hub:focus-visible { outline: 4px solid rgba(74, 144, 226, .6); outline-offset: 3px; }

.sll-wheel-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: min(100%, 620px); margin-top: 10px; }
.sll-wheel-actions .sll-btn { flex: 1 1 200px; width: auto; }
.sll-wheel-note { margin: 10px 0 0; min-height: 1.3em; font-size: .9rem; color: var(--muted); text-align: center; }

/* Full screen (for projecting in class) */
.sll-wheelcard:fullscreen, .sll-wheelcard:-webkit-full-screen { justify-content: center; background: var(--bg); border-radius: 0; border: 0; }
.sll-wheelcard:fullscreen .sll-wheelbox, .sll-wheelcard:-webkit-full-screen .sll-wheelbox { width: min(92vw, 80vh); }

/* Winner pop-up */
.sll-modal { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(31, 45, 58, .55); }
.sll-modal[hidden] { display: none; }
.sll-modal-box { width: min(100%, 460px); padding: 26px 22px 22px; border-radius: 20px; background: #fff; text-align: center; box-shadow: 0 16px 50px rgba(0, 0, 0, .35); border-top: 10px solid var(--win, var(--amber)); animation: sll-pop .28s ease-out; }
@keyframes sll-pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.sll-win-label { margin: 0 0 6px; font-size: .95rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sll-win-name { margin: 0 0 20px; font-size: clamp(1.8rem, 6vw, 2.8rem); font-weight: 800; line-height: 1.15; color: var(--blue); overflow-wrap: anywhere; }
.sll-modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.sll-modal-actions .sll-btn { flex: 1 1 140px; width: auto; }
.sll-confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; }

/* ---------- Controls ---------- */
.sll-controls { padding: 14px 18px 18px; }
.sll-tabs { margin-bottom: 4px; }
.sll-panel[hidden] { display: none; }
.sll-field { padding: 15px 0; border-bottom: 1px solid var(--line); }
.sll-field.sll-last { border-bottom: 0; }
.sll-label { display: block; margin: 0 0 8px; font-size: .85rem; font-weight: 700; color: var(--blue); }
.sll-sublabel { display: block; margin: 12px 0 6px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.sll-hint { margin: 7px 0 0; font-size: .8rem; color: var(--muted); }
.sll-hint.sll-bad { color: #b3261e; font-weight: 600; }

.sll-app select, .sll-app textarea, .sll-app input[type="number"] {
  width: 100%; margin: 0; padding: 10px 12px;
  border: 1px solid #c5d3df; border-radius: 10px; background: #fff; color: var(--ink);
  font: inherit; font-size: .95rem;
}
.sll-app textarea { min-height: 220px; resize: vertical; line-height: 1.5; }
.sll-app select + textarea { margin-top: 8px; }
.sll-app button { font: inherit; }
.sll-app select:focus-visible, .sll-app textarea:focus-visible, .sll-app input:focus-visible, .sll-app button:focus-visible {
  outline: 3px solid rgba(74, 144, 226, .5); outline-offset: 1px;
}

.sll-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--blue-soft); border-radius: 12px; }
.sll-seg button { min-height: 42px; padding: 8px 4px; border: 0; border-radius: 9px; background: transparent; color: var(--blue); font-size: .92rem; font-weight: 600; cursor: pointer; }
.sll-seg button:hover { background: rgba(43, 91, 132, .08); }
.sll-seg button[aria-pressed="true"] { background: var(--blue); color: #fff; box-shadow: 0 1px 3px rgba(31, 70, 102, .35); }

.sll-toolrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.sll-chip { min-height: 38px; padding: 6px 14px; border: 2px solid var(--blue); border-radius: 999px; background: #fff; color: var(--blue); font-size: .88rem; font-weight: 700; cursor: pointer; }
.sll-chip:hover { background: var(--blue-soft); }
.sll-numrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.sll-link { padding: 4px 6px; border: 0; background: none; color: var(--blue); font-weight: 600; font-size: .85rem; text-decoration: underline; cursor: pointer; }

.sll-swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sll-swatch { padding: 6px; border: 2px solid transparent; border-radius: 12px; background: var(--blue-soft); cursor: pointer; }
.sll-swatch[aria-pressed="true"] { border-color: var(--blue); background: #fff; }
.sll-swatch i { display: block; height: 14px; border-radius: 7px; margin-bottom: 4px; }
.sll-swatch span { display: block; font-size: .75rem; font-weight: 600; color: var(--ink); }

/* Buttons */
.sll-btn { min-height: 48px; padding: 12px 16px; border: 0; border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform .08s ease; }
.sll-btn:active { transform: translateY(2px); }
.sll-btn[disabled] { opacity: .55; cursor: default; }
.sll-btn-primary { background: var(--amber); color: #2a1d00; box-shadow: 0 3px 0 var(--amber-dark); }
.sll-btn-blue { background: var(--blue); color: #fff; box-shadow: 0 3px 0 var(--blue-dark); }
.sll-btn-outline { background: #fff; color: var(--blue); border: 2px solid var(--blue); }

/* Results */
.sll-results { margin: 0; padding: 0; list-style: none; max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: #fbfdff; }
.sll-results li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
.sll-results li:last-child { border-bottom: 0; }
.sll-results i { flex: none; width: 12px; height: 12px; border-radius: 50%; }
.sll-results .t { margin-left: auto; font-size: .78rem; font-weight: 400; color: var(--muted); }
.sll-empty { padding: 18px 12px; text-align: center; color: var(--muted); font-style: italic; }
</style>
</head>
<body style="margin:0">

<div class="sll-app">
  <div class="sll-wrap">

    <header class="sll-header">
      <div class="sll-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#f5a623"></circle><path d="M16 16L16 3A13 13 0 0 1 27.3 9.5Z" fill="#fff" opacity=".9"></path><path d="M16 16L27.3 22.5A13 13 0 0 1 16 29Z" fill="#fff" opacity=".9"></path><path d="M16 16L4.7 22.5A13 13 0 0 1 4.7 9.5Z" fill="#fff" opacity=".9"></path><circle cx="16" cy="16" r="3.5" fill="#2b5b84"></circle></svg>
      </div>
      <div>
        <h1 class="sll-title-main">Spin the Wheel</h1>
        <p class="sll-tagline">Story Learning Lab: pick a student, a topic or a word at random</p>
      </div>
    </header>

    <div class="sll-layout">

      <!-- The wheel -->
      <section class="sll-card sll-wheelcard" id="sll-wheelcard" aria-label="Wheel">
        <div class="sll-wheelbox" id="sll-wheelbox">
          <canvas id="sll-canvas" tabindex="0" role="button" aria-label="Spin the wheel"></canvas>
          <div class="sll-pointer" id="sll-pointer" aria-hidden="true">
            <svg viewBox="0 0 40 56"><path d="M20 54L3 10Q20 -4 37 10Z" fill="#f5a623" stroke="#1f4666" stroke-width="3" stroke-linejoin="round"></path><circle cx="20" cy="14" r="4" fill="#1f4666"></circle></svg>
          </div>
          <button type="button" class="sll-hub" id="sll-hub" aria-label="Spin the wheel">SPIN</button>
        </div>
        <p class="sll-wheel-note" id="sll-note" role="status"></p>
        <div class="sll-wheel-actions">
          <button type="button" class="sll-btn sll-btn-primary" id="sll-spin">Spin the wheel</button>
          <button type="button" class="sll-btn sll-btn-outline" id="sll-full">Full screen</button>
        </div>

        <div class="sll-modal" id="sll-modal" hidden role="dialog" aria-modal="true" aria-labelledby="sll-win-label">
          <div class="sll-modal-box" id="sll-modal-box">
            <p class="sll-win-label" id="sll-win-label">We have a winner!</p>
            <p class="sll-win-name" id="sll-win-name"></p>
            <div class="sll-modal-actions">
              <button type="button" class="sll-btn sll-btn-blue" id="sll-close">Close</button>
              <button type="button" class="sll-btn sll-btn-outline" id="sll-remove">Remove from wheel</button>
            </div>
          </div>
        </div>
        <canvas class="sll-confetti" id="sll-confetti" aria-hidden="true"></canvas>
      </section>

      <!-- Controls -->
      <section class="sll-card sll-controls" aria-label="Wheel settings">
        <div class="sll-seg sll-tabs" id="sll-tabs" role="group" aria-label="Panels">
          <button type="button" data-tab="entries">Entries</button>
          <button type="button" data-tab="results">Results</button>
          <button type="button" data-tab="options">Options</button>
        </div>

        <!-- Entries -->
        <div class="sll-panel" id="sll-panel-entries">
          <div class="sll-field sll-last">
            <label class="sll-label" for="sll-preset">Entries</label>
            <select id="sll-preset">
              <option value="custom">Your own list (type below)</option>
              <option value="names">Sample: class names</option>
              <option value="jobs">Classroom jobs</option>
              <option value="topics">Speaking topics</option>
              <option value="questions">Question words</option>
              <option value="actions">Act it out (verbs)</option>
              <option value="yesno">Yes or no</option>
            </select>
            <textarea id="sll-text" rows="10" aria-label="Entries, one per line" placeholder="Type one name or word per line..."></textarea>
            <p class="sll-hint" id="sll-count">0 entries</p>
            <div class="sll-toolrow">
              <button type="button" class="sll-chip" id="sll-shuffle">Shuffle order</button>
              <button type="button" class="sll-chip" id="sll-sort">Sort A to Z</button>
              <button type="button" class="sll-chip" id="sll-clear">Clear all</button>
            </div>
            <span class="sll-sublabel" id="sll-num-label">Or spin for a number</span>
            <div class="sll-numrow">
              <input type="number" id="sll-num" min="2" max="300" value="30" inputmode="numeric" aria-labelledby="sll-num-label">
              <button type="button" class="sll-chip" id="sll-makenum">Use numbers 1 to N</button>
            </div>
          </div>
        </div>

        <!-- Results -->
        <div class="sll-panel" id="sll-panel-results" hidden>
          <div class="sll-field sll-last">
            <span class="sll-label">Who has been picked</span>
            <ul class="sll-results" id="sll-results"></ul>
            <div class="sll-toolrow">
              <button type="button" class="sll-chip" id="sll-copy">Copy the list</button>
              <button type="button" class="sll-chip" id="sll-clearres">Clear results</button>
            </div>
          </div>
        </div>

        <!-- Options -->
        <div class="sll-panel" id="sll-panel-options" hidden>
          <div class="sll-field">
            <span class="sll-label" id="sll-theme-label">Colors</span>
            <div class="sll-swatches" id="sll-theme" role="group" aria-labelledby="sll-theme-label"></div>
          </div>
          <div class="sll-field">
            <span class="sll-label" id="sll-dur-label">How long it spins</span>
            <div class="sll-seg" id="sll-dur" role="group" aria-labelledby="sll-dur-label">
              <button type="button" data-dur="3">Short</button>
              <button type="button" data-dur="6">Medium</button>
              <button type="button" data-dur="10">Long</button>
            </div>
          </div>
          <div class="sll-field">
            <span class="sll-label" id="sll-auto-label">After each spin</span>
            <div class="sll-seg" id="sll-auto" role="group" aria-labelledby="sll-auto-label">
              <button type="button" data-auto="keep">Keep the winner</button>
              <button type="button" data-auto="remove">Remove the winner</button>
            </div>
            <p class="sll-hint">Remove the winner so everyone gets a turn before anyone is picked twice.</p>
          </div>
          <div class="sll-field sll-last">
            <span class="sll-label" id="sll-sound-label">Sound</span>
            <div class="sll-seg" id="sll-sound" role="group" aria-labelledby="sll-sound-label">
              <button type="button" data-sound="on">On</button>
              <button type="button" data-sound="off">Off</button>
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var TAU = Math.PI * 2;
  var MAX_ENTRIES = 300;
  var STORE_KEY = 'sll-wheel-v1';

  var THEMES = {
    classic: { name: 'Classic', colors: ['#2b5b84', '#f5a623', '#4a90e2', '#2a9d8f', '#e76f51', '#8e6bbf', '#d9577a', '#6aa84f'] },
    rainbow: { name: 'Rainbow', colors: ['#e63946', '#f77f00', '#f2b705', '#2a9d4b', '#1d9bf0', '#4f46e5', '#9b5de5', '#e0529c'] },
    pastel: { name: 'Pastel', colors: ['#ffadad', '#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', '#a0c4ff', '#bdb2ff', '#ffc6ff'] },
    ocean: { name: 'Ocean', colors: ['#03396c', '#1a7fb8', '#00a6a6', '#5fd0c5', '#005b96', '#3aa5c9', '#0b7a75', '#7bc8a4'] }
  };

  var PRESETS = {
    names: 'Ava, Ben, Chloe, Daniel, Emma, Finn, Grace, Henry, Isla, Jack, Kate, Leo',
    jobs: 'Line leader, Door holder, Board cleaner, Pencil helper, Light switch, Messenger, Plant waterer, Book helper',
    topics: 'My family, My favorite food, My weekend, My hobby, My best friend, My pet, My school day, My dream trip',
    questions: 'Who, What, Where, When, Why, How',
    actions: 'jump, run, sleep, swim, dance, cook, read, sing, eat, climb, clap, wave',
    yesno: 'Yes, No'
  };

  var settings = { theme: 'classic', dur: 6, auto: 'keep', sound: 'on' };
  var entries = [];
  var theta = 0;              // current rotation of the wheel (radians)
  var spinning = false;
  var winnerIdx = -1;
  var history = [];
  var flick = 0;
  var audio = null, lastTick = 0;
  var debounce = null, cache = null, dpr = 1, size = 0;

  function $(id) { return document.getElementById(id); }
  var canvas = $('sll-canvas'), ctx = canvas.getContext('2d');
  var box = $('sll-wheelbox');

  /* ---------- Saving (optional: works only where the browser allows it) ---------- */
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ text: $('sll-text').value, theme: settings.theme, dur: settings.dur, auto: settings.auto, sound: settings.sound })); } catch (e) {}
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (s) {
        if (s.text !== undefined) $('sll-text').value = s.text;
        if (THEMES[s.theme]) settings.theme = s.theme;
        if (s.dur) settings.dur = s.dur;
        if (s.auto) settings.auto = s.auto;
        if (s.sound) settings.sound = s.sound;
        return true;
      }
    } catch (e) {}
    return false;
  }

  /* ---------- Entries ---------- */
  function readEntries() {
    var list = $('sll-text').value.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    return list.slice(0, MAX_ENTRIES);
  }

  function entriesChanged(keepAngle) {
    entries = readEntries();
    var n = entries.length, c = $('sll-count');
    var over = $('sll-text').value.split(/\r?\n/).filter(function (s) { return s.trim(); }).length > MAX_ENTRIES;
    c.className = 'sll-hint' + (n < 2 ? ' sll-bad' : '');
    c.textContent = n + (n === 1 ? ' entry' : ' entries') + (n < 2 ? '. Add at least 2 to spin.' : '.') + (over ? ' Only the first ' + MAX_ENTRIES + ' are used.' : '');
    $('sll-spin').disabled = n < 2 || spinning;
    $('sll-hub').disabled = n < 2 || spinning;
    setNote(n < 2 ? 'Add at least 2 entries to spin the wheel.' : '');
    buildCache();
    draw();
    save();
  }

  function setNote(msg) { $('sll-note').textContent = msg; }

  /* ---------- Drawing ---------- */
  function lum(hex) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  }
  function colorFor(i, n) {
    var cols = THEMES[settings.theme].colors, k = cols.length, idx = i % k;
    // Avoid the last slice matching the first slice's colour
    if (n > 1 && i === n - 1 && idx === 0) idx = Math.floor(k / 2);
    return cols[idx];
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var w = Math.max(200, Math.round(box.clientWidth * dpr));
    if (w === size) return;
    size = w;
    canvas.width = size; canvas.height = size;
    $('sll-hub').style.fontSize = (box.clientWidth * 0.042) + 'px';
    buildCache();
    draw();
  }

  function buildCache() {
    if (!size) return;
    cache = document.createElement('canvas');
    cache.width = size; cache.height = size;
    var g = cache.getContext('2d'), cx = size / 2, R = size / 2 - size * 0.012, n = entries.length;
    g.translate(cx, cx);

    if (n === 0) {
      g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fillStyle = '#dbe6f0'; g.fill();
      g.fillStyle = '#7b8ea1'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = '700 ' + (R * 0.09) + 'px "Segoe UI", Arial, sans-serif';
      g.fillText('Add some entries', 0, R * 0.32);
    } else {
      var a = TAU / n;
      for (var i = 0; i < n; i++) {
        g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R, i * a, (i + 1) * a); g.closePath();
        g.fillStyle = colorFor(i, n); g.fill();
        if (n > 1) { g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = Math.max(1, R * 0.006); g.stroke(); }
      }
      // Labels
      var font = '"Segoe UI", "Helvetica Neue", Arial, sans-serif';
      for (var j = 0; j < n; j++) {
        var label = entries[j], col = colorFor(j, n);
        var maxH = n === 1 ? R * 0.2 : a * R * 0.6 * 0.7;     // height available at about 60% of the radius
        var base = Math.min(R * 0.12, maxH);
        var maxW = R * 0.7, startX = R * 0.93;
        g.font = '700 ' + base + 'px ' + font;
        var w = g.measureText(label).width, fs = base;
        if (w > maxW) fs = base * maxW / w;
        var minFs = 9 * dpr;
        if (fs < minFs) {
          fs = minFs; g.font = '700 ' + fs + 'px ' + font;
          while (label.length > 2 && g.measureText(label + '\u2026').width > maxW) label = label.slice(0, -1);
          label = label + '\u2026';
        }
        if (fs > maxH * 1.15 && n > 1) continue;   // slice too thin to read: skip the label
        g.save();
        g.rotate(j * a + a / 2);
        g.font = '700 ' + fs + 'px ' + font;
        g.textAlign = 'right'; g.textBaseline = 'middle';
        g.fillStyle = lum(col) > 0.62 ? '#1f2d3a' : '#ffffff';
        g.fillText(label, startX, 0);
        g.restore();
      }
    }
    // Outer ring
    g.beginPath(); g.arc(0, 0, R, 0, TAU);
    g.lineWidth = size * 0.012; g.strokeStyle = '#ffffff'; g.stroke();
  }

  function draw() {
    if (!size) return;
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.translate(size / 2, size / 2);
    ctx.rotate(theta);
    if (cache) ctx.drawImage(cache, -size / 2, -size / 2);
    ctx.restore();
    $('sll-pointer').style.transform = 'rotate(' + flick.toFixed(1) + 'deg)';
  }

  function indexAt(th) {
    var n = entries.length, a = TAU / n;
    var phi = (((-Math.PI / 2 - th) % TAU) + TAU) % TAU;
    return Math.min(n - 1, Math.floor(phi / a));
  }

  /* ---------- Sound ---------- */
  function ensureAudio() {
    if (settings.sound !== 'on') return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) { audio = null; }
  }
  function beep(freq, dur, vol, type, when) {
    if (!audio || settings.sound !== 'on') return;
    try {
      var t = audio.currentTime + (when || 0), o = audio.createOscillator(), g = audio.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function tick() {
    var now = performance.now();
    if (now - lastTick < 28) return;
    lastTick = now;
    beep(1500, 0.03, 0.07, 'square');
  }
  function fanfare() {
    [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.22, 0.12, 'triangle', i * 0.11); });
  }

  /* ---------- Spinning ---------- */
  function ease(t) { return 1 - Math.pow(1 - t, 4); }

  function spin() {
    if (spinning || entries.length < 2) return;
    ensureAudio();
    closeModal(false);
    spinning = true;
    $('sll-spin').disabled = true; $('sll-hub').disabled = true;
    setNote('Spinning…');

    var start = theta;
    var target = start + (5 + Math.random() * 3) * TAU + Math.random() * TAU;   // fair: the final angle is random
    var dur = settings.dur * 1000 * (0.9 + Math.random() * 0.2);
    var t0 = performance.now(), last = indexAt(start);

    function frame(now) {
      var t = Math.min(1, (now - t0) / dur);
      theta = start + (target - start) * ease(t);
      var idx = indexAt(theta);
      if (idx !== last) { last = idx; tick(); flick = 16; }
      flick *= 0.82; if (flick < 0.3) flick = 0;
      draw();
      if (t < 1) requestAnimationFrame(frame); else finish();
    }
    requestAnimationFrame(frame);
  }

  function finish() {
    spinning = false;
    flick = 0; draw();
    winnerIdx = indexAt(theta);
    var name = entries[winnerIdx], col = colorFor(winnerIdx, entries.length);
    history.unshift({ name: name, color: col, time: new Date() });
    renderResults();
    setNote('');
    showModal(name, col);
    fanfare();
    confetti(THEMES[settings.theme].colors);
    $('sll-spin').disabled = entries.length < 2;
    $('sll-hub').disabled = entries.length < 2;
  }

  /* ---------- Winner pop-up ---------- */
  function showModal(name, col) {
    var auto = settings.auto === 'remove';
    $('sll-win-name').textContent = name;
    $('sll-modal-box').style.setProperty('--win', col);
    $('sll-close').textContent = auto ? 'OK (remove the name)' : 'Close';
    $('sll-remove').textContent = auto ? 'Keep on wheel' : 'Remove from wheel';
    $('sll-modal').hidden = false;
    $('sll-close').focus({ preventScroll: true });
  }

  // apply: whether to apply the "remove the winner" setting when closing
  function closeModal(apply) {
    if ($('sll-modal').hidden) return;
    $('sll-modal').hidden = true;
    if (apply && settings.auto === 'remove') removeWinner();
  }

  function removeWinner() {
    if (winnerIdx < 0 || winnerIdx >= entries.length) return;
    var lines = $('sll-text').value.split(/\r?\n/), seen = -1, out = [];
    // Remove the matching line (the same position in the cleaned list)
    lines.forEach(function (ln) {
      if (ln.trim()) { seen++; if (seen === winnerIdx) return; }
      out.push(ln);
    });
    $('sll-text').value = out.join('\n');
    $('sll-preset').value = 'custom';
    winnerIdx = -1;
    entriesChanged();
  }

  /* ---------- Results ---------- */
  function renderResults() {
    var ul = $('sll-results');
    ul.innerHTML = '';
    if (!history.length) { ul.innerHTML = '<li class="sll-empty">No spins yet.</li>'; return; }
    history.forEach(function (h, i) {
      var li = document.createElement('li');
      var dot = document.createElement('i'); dot.style.background = h.color;
      var nm = document.createElement('span'); nm.textContent = (history.length - i) + '. ' + h.name;
      var tm = document.createElement('span'); tm.className = 't';
      tm.textContent = h.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      li.appendChild(dot); li.appendChild(nm); li.appendChild(tm);
      ul.appendChild(li);
    });
  }

  /* ---------- Confetti ---------- */
  function confetti(colors) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cv = $('sll-confetti'), g = cv.getContext('2d');
    var w = cv.clientWidth, h = cv.clientHeight, r = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = w * r; cv.height = h * r; g.scale(r, r);
    var parts = [], i;
    for (i = 0; i < 110; i++) {
      parts.push({ x: w / 2 + (Math.random() - 0.5) * w * 0.2, y: h * 0.45, vx: (Math.random() - 0.5) * 11, vy: -Math.random() * 12 - 3,
        s: 5 + Math.random() * 6, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.4, c: colors[i % colors.length] });
    }
    var t0 = performance.now();
    (function step(now) {
      var el = now - t0;
      g.clearRect(0, 0, w, h);
      parts.forEach(function (p) {
        p.vy += 0.28; p.vx *= 0.995; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
        g.globalAlpha = Math.max(0, 1 - el / 2800);
        g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6);
        g.restore();
      });
      if (el < 2800) requestAnimationFrame(step); else g.clearRect(0, 0, w, h);
    })(t0);
  }

  /* ---------- Controls ---------- */
  function syncControls() {
    function press(sel, attr, test) {
      document.querySelectorAll(sel).forEach(function (b) { b.setAttribute('aria-pressed', String(test(b.dataset[attr]))); });
    }
    press('[data-dur]', 'dur', function (v) { return +v === settings.dur; });
    press('[data-auto]', 'auto', function (v) { return v === settings.auto; });
    press('[data-sound]', 'sound', function (v) { return v === settings.sound; });
    press('[data-theme]', 'theme', function (v) { return v === settings.theme; });
  }

  function buildSwatches() {
    var wrap = $('sll-theme');
    Object.keys(THEMES).forEach(function (k) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'sll-swatch'; b.dataset.theme = k;
      var cols = THEMES[k].colors.slice(0, 5).map(function (c) { return c + ' 0'; });
      var grad = 'linear-gradient(90deg,' + THEMES[k].colors.slice(0, 6).map(function (c, i, a) { return c + ' ' + (i / a.length * 100) + '% ' + ((i + 1) / a.length * 100) + '%'; }).join(',') + ')';
      b.innerHTML = '<i style="background:' + grad + '"></i><span>' + THEMES[k].name + '</span>';
      b.addEventListener('click', function () { settings.theme = k; syncControls(); buildCache(); draw(); save(); });
      wrap.appendChild(b);
    });
  }

  function showTab(name) {
    ['entries', 'results', 'options'].forEach(function (t) { $('sll-panel-' + t).hidden = t !== name; });
    document.querySelectorAll('[data-tab]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.tab === name)); });
  }

  function shuffleArr(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function setList(arr) {
    $('sll-text').value = arr.join('\n');
    $('sll-preset').value = 'custom';
    entriesChanged();
  }

  function toggleFull() {
    var el = $('sll-wheelcard');
    var inFull = document.fullscreenElement || document.webkitFullscreenElement;
    try {
      if (inFull) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } catch (e) { setNote('Full screen is not available in this browser.'); }
  }

  function init() {
    var had = load();
    if (!had) $('sll-text').value = PRESETS.names.split(', ').join('\n');
    buildSwatches();
    syncControls();
    showTab('entries');
    renderResults();

    document.querySelectorAll('[data-tab]').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });
    document.querySelectorAll('[data-dur]').forEach(function (b) { b.addEventListener('click', function () { settings.dur = +b.dataset.dur; syncControls(); save(); }); });
    document.querySelectorAll('[data-auto]').forEach(function (b) { b.addEventListener('click', function () { settings.auto = b.dataset.auto; syncControls(); save(); }); });
    document.querySelectorAll('[data-sound]').forEach(function (b) { b.addEventListener('click', function () { settings.sound = b.dataset.sound; syncControls(); save(); if (settings.sound === 'on') { ensureAudio(); beep(880, 0.08, 0.08, 'triangle'); } }); });

    $('sll-preset').addEventListener('change', function () {
      var v = this.value;
      if (v !== 'custom' && PRESETS[v]) { $('sll-text').value = PRESETS[v].split(', ').join('\n'); entriesChanged(); }
    });
    $('sll-text').addEventListener('input', function () {
      $('sll-preset').value = 'custom';
      clearTimeout(debounce);
      debounce = setTimeout(entriesChanged, 250);
    });
    $('sll-shuffle').addEventListener('click', function () { setList(shuffleArr(readEntries())); });
    $('sll-sort').addEventListener('click', function () { setList(readEntries().sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }); })); });
    $('sll-clear').addEventListener('click', function () { setList([]); $('sll-text').focus(); });
    $('sll-makenum').addEventListener('click', function () {
      var n = Math.max(2, Math.min(MAX_ENTRIES, parseInt($('sll-num').value, 10) || 2));
      $('sll-num').value = n;
      var a = []; for (var i = 1; i <= n; i++) a.push(String(i));
      setList(a);
    });

    $('sll-spin').addEventListener('click', spin);
    $('sll-hub').addEventListener('click', spin);
    canvas.addEventListener('click', spin);
    canvas.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); spin(); } });
    $('sll-full').addEventListener('click', toggleFull);

    $('sll-close').addEventListener('click', function () { closeModal(true); });
    $('sll-remove').addEventListener('click', function () {
      // "Keep on wheel" (when auto-remove is on) just closes; otherwise this removes the winner
      var auto = settings.auto === 'remove';
      closeModal(false);
      if (!auto) removeWinner();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(true); });

    $('sll-copy').addEventListener('click', function () {
      var txt = history.slice().reverse().map(function (h, i) { return (i + 1) + '. ' + h.name; }).join('\n');
      if (!txt) { setNote('Nothing to copy yet.'); return; }
      try {
        navigator.clipboard.writeText(txt).then(function () { setNote('Copied the results.'); }, function () { setNote('Could not copy. Select the list and copy it by hand.'); });
      } catch (e) { setNote('Could not copy. Select the list and copy it by hand.'); }
    });
    $('sll-clearres').addEventListener('click', function () { history = []; renderResults(); });

    if (window.ResizeObserver) new ResizeObserver(resize).observe(box);
    window.addEventListener('resize', resize);
    document.addEventListener('fullscreenchange', function () { setTimeout(resize, 60); });
    document.addEventListener('webkitfullscreenchange', function () { setTimeout(resize, 60); });

    resize();
    entriesChanged();
  }

  init();
})();
</script>
</body>
</html>
